name: Build ZT-AppLocker (x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ZT-AppLocker v3.0 with .NET Framework 4.x csc.exe
        shell: pwsh
        run: .\Build-ZTAppLocker-v3.ps1

      - name: Upload compiled ZT-AppLocker.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZT-AppLocker-v3.0-x64
          path: dist/ZT-AppLocker.exe
          if-no-files-found: error
